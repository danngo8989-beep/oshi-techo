<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推し活手帳 - 推しの予定とお金をまとめて管理</title>
<meta name="description" content="推しごとの支出・予算・現場カレンダー・遠征費見積もり・記念日カウントを1画面で。無料で使える推し活管理アプリ。">
<meta name="theme-color" content="#e14d7f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#fff6f9; --card:#ffffff; --ink:#3b2a34; --sub:#6e5260;
  --accent:#e14d7f; --accent-dark:#c73868; --accent2:#8e5bd6;
  --line:#f2dce6; --ok:#2e9e6b; --warn:#d94848;
  --shadow:0 2px 10px rgba(180,90,130,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  line-height:1.6; padding-bottom:84px;
}
header.appbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(135deg,#e14d7f,#a95bd6);
  color:#fff; padding:14px 18px calc(14px);
  display:flex; align-items:center; gap:10px;
}
header.appbar h1{font-size:1.2rem; margin:0; font-weight:700; letter-spacing:.05em}
header.appbar .sub{font-size:.85rem; opacity:.92}
main{max-width:520px; margin:0 auto; padding:14px 14px 20px}
h2.sec{font-size:1.05rem; margin:20px 4px 10px; display:flex; align-items:center; gap:6px}
.card{
  background:var(--card); border-radius:16px; box-shadow:var(--shadow);
  padding:16px; margin-bottom:12px; border:1px solid var(--line);
}
.muted{color:var(--sub); font-size:.9rem}
.big{font-size:1.9rem; font-weight:800; line-height:1.2}
.center{text-align:center}

/* buttons */
button{
  font:inherit; font-size:1rem; cursor:pointer; border:none; border-radius:14px;
  min-height:48px; padding:10px 18px; color:var(--ink); background:#f6e7ee;
}
button.primary{background:var(--accent); color:#fff; font-weight:700}
button.primary:active{background:var(--accent-dark)}
button.ghost{background:transparent; border:2px solid var(--line); color:var(--sub)}
button.danger{background:#fdecec; color:#c22; font-weight:600}
button.fab{
  width:100%; font-weight:700; font-size:1.05rem;
  background:var(--accent); color:#fff; margin:4px 0 14px;
}
.iconbtn{min-height:44px; min-width:44px; padding:6px; background:transparent; font-size:1.15rem}

/* forms */
label.f{display:block; margin:12px 0 4px; font-weight:600; font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; font:inherit; font-size:1rem; padding:12px; min-height:48px;
  border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--accent); border-color:transparent}
.lbl{font-weight:600; font-size:.95rem; margin:14px 0 6px}
.row2{display:flex; gap:8px}
.row2>*{flex:1}
.btnrow{display:flex; gap:10px; margin-top:18px}
.btnrow button{flex:1}

/* chips / swatches */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:2px solid var(--line); background:#fff; border-radius:999px;
  padding:8px 14px; min-height:44px; font-size:.95rem; color:var(--ink);
}
.chip.on{border-color:var(--accent); background:#fdeff5; font-weight:700; color:var(--accent-dark)}
.swatches{display:flex; flex-wrap:wrap; gap:10px}
.sw{
  width:44px; height:44px; border-radius:50%; border:3px solid transparent; padding:0;
  min-height:44px;
}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 2px #fff inset}

/* oshi dot */
.dot{display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid rgba(0,0,0,.12)}

/* countdown card */
.cdown{
  background:linear-gradient(135deg,#fff,#fdeff5);
  border:1.5px solid #f5cede;
}
.cdown .days{font-size:2.6rem; font-weight:800; color:var(--accent-dark); line-height:1.1}

/* budget bar */
.bar{height:14px; background:#f3e2ea; border-radius:999px; overflow:hidden; margin:8px 0 4px}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,#e14d7f,#a95bd6); border-radius:999px}
.bar>i.over{background:var(--warn)}

/* list items */
.item{
  display:flex; align-items:center; gap:10px; padding:12px 4px;
  border-bottom:1px solid var(--line); min-height:52px;
}
.item:last-child{border-bottom:none}
.item .grow{flex:1; min-width:0}
.item .ttl{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .amt{font-weight:800; font-size:1.05rem; white-space:nowrap}
.badge{
  display:inline-block; font-size:.78rem; font-weight:700; border-radius:8px;
  padding:2px 8px; background:#f3e7f9; color:#6a3fa0; margin-right:6px;
}
.badge.ev{background:#fdeff5; color:var(--accent-dark)}
.cd-mini{font-weight:800; color:var(--accent-dark); font-size:1.15rem; min-width:74px; text-align:center}
.cd-mini small{display:block; font-weight:600; color:var(--sub); font-size:.75rem}

/* category bars */
.catrow{display:flex; align-items:center; gap:8px; margin:6px 0}
.catrow .nm{width:7.5em; font-size:.9rem}
.catrow .bg{flex:1; height:12px; background:#f3e2ea; border-radius:999px; overflow:hidden}
.catrow .bg>i{display:block; height:100%; background:var(--accent2); border-radius:999px}
.catrow .vl{width:5.5em; text-align:right; font-size:.9rem; font-weight:700}

/* month nav */
.mnav{display:flex; align-items:center; justify-content:space-between; margin:4px 0 10px}
.mnav b{font-size:1.1rem}
.mnav button{min-width:48px}

/* tabs */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:#fff; border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(180,90,130,.08);
}
nav.tabs button{
  flex:1; background:none; border-radius:0; min-height:60px; padding:6px 0 8px;
  display:flex; flex-direction:column; align-items:center; gap:0;
  font-size:.78rem; color:var(--sub); font-weight:600;
}
nav.tabs button .ic{font-size:1.45rem; line-height:1.3}
nav.tabs button.on{color:var(--accent-dark)}
section.page{display:none}
section.page.on{display:block; animation:fade .18s ease}
@keyframes fade{from{opacity:.4; transform:translateY(4px)}to{opacity:1; transform:none}}

/* modal */
.modal{
  position:fixed; inset:0; z-index:50; background:rgba(60,30,45,.45);
  display:flex; align-items:flex-end; justify-content:center;
}
.modal[hidden]{display:none}
.sheet{
  background:#fff; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
}
.sheet h2{margin:0 0 6px; font-size:1.15rem}
.anniv-row{display:flex; gap:6px; align-items:center; margin:6px 0}
.anniv-row input{min-width:0}
.trip-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.trip-total{font-size:1.15rem; font-weight:800; color:var(--accent-dark); text-align:right; margin-top:8px}
.empty{
  text-align:center; color:var(--sub); padding:26px 10px; font-size:.95rem;
}
.empty .em{font-size:2.2rem; display:block; margin-bottom:6px}
details.past summary{min-height:44px; display:flex; align-items:center; font-weight:600; color:var(--sub); cursor:pointer; padding:4px}
.footnote{text-align:center; color:var(--sub); font-size:.8rem; margin:24px 0 8px}
</style>
</head>
<body>

<header class="appbar">
  <div style="font-size:1.5rem">💖</div>
  <div>
    <h1>推し活手帳</h1>
    <div class="sub">推しの予定とお金、ぜんぶここに。</div>
  </div>
</header>

<main>
  <!-- ホーム -->
  <section class="page on" id="page-home">
    <div id="homeWelcome"></div>
    <div id="homeNextEvent"></div>
    <div id="homeBudget"></div>
    <div id="homeOshiDays"></div>
    <div id="homeAnnivs"></div>
  </section>

  <!-- 予定 -->
  <section class="page" id="page-events">
    <button class="fab" id="btnNewEvent">＋ 現場・予定を追加</button>
    <div id="eventList"></div>
  </section>

  <!-- お金 -->
  <section class="page" id="page-money">
    <button class="fab" id="btnNewExpense">＋ 支出を記録</button>
    <div class="mnav card" style="padding:8px 10px">
      <button class="iconbtn" id="mPrev" aria-label="前の月">◀</button>
      <b id="mLabel"></b>
      <button class="iconbtn" id="mNext" aria-label="次の月">▶</button>
    </div>
    <div id="moneySummary"></div>
    <div id="moneyByOshi"></div>
    <div id="moneyByCat"></div>
    <h2 class="sec">📝 支出の記録</h2>
    <div class="card" id="expenseList"></div>
  </section>

  <!-- 推し -->
  <section class="page" id="page-oshi">
    <button class="fab" id="btnNewOshi">＋ 推しを登録</button>
    <div id="oshiList"></div>
    <div class="footnote">データはこの端末の中だけに保存されます（外部送信なし）<br>
      <a href="./help.html" style="color:var(--accent)">使い方</a>　|　<a href="./privacy.html" style="color:var(--accent)">プライバシーポリシー</a></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="home" class="on"><span class="ic">🏠</span>ホーム</button>
  <button data-tab="events"><span class="ic">📅</span>予定</button>
  <button data-tab="money"><span class="ic">💰</span>お金</button>
  <button data-tab="oshi"><span class="ic">💖</span>推し</button>
</nav>

<!-- 推し登録モーダル -->
<div class="modal" id="modal-oshi" hidden>
  <div class="sheet">
    <h2 id="oshiFormTitle">推しを登録</h2>
    <label class="f" for="oshiName">名前（推し・グループ名）</label>
    <input type="text" id="oshiName" maxlength="24" placeholder="例：星野アイ">
    <label class="f" for="oshiGenre">ジャンル（任意）</label>
    <input type="text" id="oshiGenre" maxlength="24" placeholder="例：アイドル / VTuber / 俳優">
    <div class="lbl">推しカラー</div>
    <div class="swatches" id="oshiSwatches"></div>
    <label class="f" for="oshiSince">推し始めた日（任意）</label>
    <input type="date" id="oshiSince">
    <div class="lbl">記念日（任意・毎年カウントダウンします）</div>
    <div id="annivRows"></div>
    <button class="ghost" id="btnAddAnniv" style="width:100%">＋ 記念日を追加（誕生日など）</button>
    <div class="btnrow">
      <button class="ghost" data-close>キャンセル</button>
      <button class="primary" id="btnSaveOshi">保存する</button>
    </div>
    <button class="danger" id="btnDelOshi" style="width:100%; margin-top:10px" hidden>この推しを削除</button>
  </div>
</div>

<!-- 予定モーダル -->
<div class="modal" id="modal-event" hidden>
  <div class="sheet">
    <h2 id="eventFormTitle">現場・予定を追加</h2>
    <label class="f" for="evTitle">タイトル</label>
    <input type="text" id="evTitle" maxlength="30" placeholder="例：全国ツアー 東京公演">
    <label class="f">どの推し？</label>
    <select id="evOshi"></select>
    <div class="lbl">種類</div>
    <div class="chips" id="evTypeChips"></div>
    <div class="row2">
      <div>
        <label class="f" for="evDate">日付</label>
        <input type="date" id="evDate">
      </div>
      <div>
        <label class="f" for="evPlace">場所（任意）</label>
        <input type="text" id="evPlace" maxlength="20" placeholder="例：横浜アリーナ">
      </div>
    </div>
    <div class="lbl">✈️ 遠征費の見積もり（任意）</div>
    <div class="trip-grid">
      <div><label class="f" for="tripTra">交通費</label><input type="number" id="tripTra" min="0" placeholder="0" inputmode="numeric"></div>
      <div><label class="f" for="tripStay">宿泊費</label><input type="number" id="tripStay" min="0" placeholder="0" inputmode="numeric"></div>
      <div><label class="f" for="tripTik">チケット</label><input type="number" id="tripTik" min="0" placeholder="0" inputmode="numeric"></div>
      <div><label class="f" for="tripGoods">グッズ予算</label><input type="number" id="tripGoods" min="0" placeholder="0" inputmode="numeric"></div>
      <div><label class="f" for="tripOther">その他</label><input type="number" id="tripOther" min="0" placeholder="0" inputmode="numeric"></div>
    </div>
    <div class="trip-total" id="tripTotal"></div>
    <div class="btnrow">
      <button class="ghost" data-close>キャンセル</button>
      <button class="primary" id="btnSaveEvent">保存する</button>
    </div>
    <button class="danger" id="btnDelEvent" style="width:100%; margin-top:10px" hidden>この予定を削除</button>
  </div>
</div>

<!-- 支出モーダル -->
<div class="modal" id="modal-expense" hidden>
  <div class="sheet">
    <h2 id="expenseFormTitle">支出を記録</h2>
    <label class="f" for="exAmount">金額（円）</label>
    <input type="number" id="exAmount" min="0" placeholder="例：8800" inputmode="numeric">
    <label class="f">どの推し？</label>
    <select id="exOshi"></select>
    <div class="lbl">カテゴリ</div>
    <div class="chips" id="exCatChips"></div>
    <div class="row2">
      <div>
        <label class="f" for="exDate">日付</label>
        <input type="date" id="exDate">
      </div>
      <div>
        <label class="f" for="exMemo">メモ（任意）</label>
        <input type="text" id="exMemo" maxlength="30" placeholder="例：アクスタ2個">
      </div>
    </div>
    <div class="btnrow">
      <button class="ghost" data-close>キャンセル</button>
      <button class="primary" id="btnSaveExpense">保存する</button>
    </div>
    <button class="danger" id="btnDelExpense" style="width:100%; margin-top:10px" hidden>この記録を削除</button>
  </div>
</div>

<!-- 予算モーダル -->
<div class="modal" id="modal-budget" hidden>
  <div class="sheet">
    <h2>月の推し活予算</h2>
    <p class="muted">毎月「ここまで使ってOK」の金額を決めておくと、ホームとお金タブで残額が見えます。0円で未設定に戻せます。</p>
    <label class="f" for="budgetInput">予算（円／月）</label>
    <input type="number" id="budgetInput" min="0" placeholder="例：15000" inputmode="numeric">
    <div class="btnrow">
      <button class="ghost" data-close>キャンセル</button>
      <button class="primary" id="btnSaveBudget">保存する</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
